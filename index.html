<html lang="en">

    <meta charset="UTF-8" />

    <title>HackArena - Team Hackathon Engine</title>
    <meta name="description" content="Full-stack real-time team hackathon platform with server-authoritative state machine, anti-cheat monitoring, and admin grading." />
    <meta property="og:title" content="HackArena - Team Hackathon Engine" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.includes('@vite/client')) ||
          (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') || String(event.reason).includes('createWebSocketModuleRunnerTransport'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
